<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Komyut diagnostics</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 1rem; line-height: 1.4; }
  button { min-height: 44px; padding: .5rem 1rem; font: inherit; }
  pre { white-space: pre-wrap; word-break: break-word; background: #f3f5f8; color: #16191d; padding: .75rem; border-radius: 8px; }
</style>
</head>
<body>
<h1>Komyut diagnostics</h1>
<p>Wait for “DONE”, then tap Copy report and paste it into the chat. You can delete this file when the site works.</p>
<button id="copy" type="button">Copy report</button>
<pre id="out">Running…</pre>
<script>
(async () => {
  const out = document.getElementById('out');
  const lines = [];
  const log = (s) => { lines.push(s); out.textContent = lines.join('\n'); };
  const base = location.pathname.replace(/[^/]*$/, '');

  document.getElementById('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(out.textContent); alert('Copied'); }
    catch (e) {
      const r = document.createRange(); r.selectNodeContents(out);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      alert('Select and copy the text manually');
    }
  });

  const FILES = [
    ['index.html', 'html'], ['css/styles.css', 'css'],
    ['js/app.js', 'js'], ['js/map.js', 'js'], ['js/data.js', 'js'], ['js/jeepney.js', 'js'], ['js/bus.js', 'js'],
    ['js/places.js', 'js'], ['js/fares.js', 'js'], ['js/plan.js', 'js'],
    ['data/jeepney.json', 'json'], ['data/jeepney-2.json', 'json'], ['data/bus.json', 'json'],
    ['data/bus-provincial.json', 'json'], ['data/places.json', 'json'], ['data/places-2.json', 'json'],
    ['data/fares.json', 'json'], ['data/paths.json', 'json'],
  ];

  async function get(path) {
    try {
      const r = await fetch(base + path, { cache: 'no-store' });
      const text = await r.text();
      return { status: r.status, type: r.headers.get('content-type') || '', text };
    } catch (e) {
      return { status: 'ERR ' + e.message, type: '', text: '' };
    }
  }

  function jsSyntax(code) {
    try {
      new Function(code.replace(/^import .*$/gm, '').replace(/^export (default )?/gm, ''));
      return 'ok';
    } catch (e) {
      return e.name + ': ' + e.message;
    }
  }

  log('URL: ' + location.href);
  log('UA: ' + navigator.userAgent);
  log('');

  let indexText = '';
  for (const [path, kind] of FILES) {
    const r = await get(path);
    if (path === 'index.html') indexText = r.text;
    if (r.status !== 200) { log(`[MISSING] ${path}  status ${r.status}`); continue; }
    let note = '';
    if (kind === 'js') {
      if (!/javascript/i.test(r.type)) note += `  WRONG TYPE: ${r.type}`;
      if (/^\s*</.test(r.text)) note += '  LOOKS LIKE HTML, NOT JS';
      note += '  syntax: ' + jsSyntax(r.text);
    } else if (kind === 'json') {
      try { JSON.parse(r.text); note += '  json: ok'; }
      catch (e) { note += '  JSON ERROR: ' + e.message; }
    }
    log(`[found] ${path}  ${r.status}  ${r.text.length} B${note}`);
  }

  log('');
  if (indexText) {
    const doc = new DOMParser().parseFromString(indexText, 'text/html');
    const refs = [...doc.querySelectorAll('script[src],link[href]')].map((n) => n.getAttribute('src') || n.getAttribute('href'));
    log('index.html references: ' + refs.join(', '));
    const need = ['panel-map', 'map-canvas', 'map-skeleton', 'map-fallback', 'sheet', 'sheet-handle', 'sheet-body',
      'search', 'clear-selection', 'route-list', 'toast', 'planner', 'plan-from', 'plan-to', 'plan-go', 'plan-swap', 'plan-results',
      'tab-map', 'tab-jeepney', 'tab-bus', 'tab-places', 'tab-fares', 'tab-about',
      'panel-jeepney', 'panel-bus', 'panel-places', 'panel-fares', 'panel-about',
      'bus-provincial', 'bus-provincial-section', 'bus-provincial-note', 'calc-taxi-field', 'calc-taxi-rate'];
    const missing = need.filter((id) => !doc.getElementById(id));
    log('Missing ids in index.html: ' + (missing.length ? missing.join(', ') : 'none'));
  } else {
    log('index.html could not be read, so ids were not checked.');
  }

  log('');
  await new Promise((resolve) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    s.onload = () => { log('Leaflet: loaded, version ' + (window.L && window.L.version)); resolve(); };
    s.onerror = () => { log('Leaflet: FAILED to load (network blocked?)'); resolve(); };
    document.head.append(s);
  });
  await new Promise((resolve) => {
    const img = new Image();
    const timer = setTimeout(() => { log('OSM tile: timed out'); resolve(); }, 8000);
    img.onload = () => { clearTimeout(timer); log('OSM tile: loaded'); resolve(); };
    img.onerror = () => { clearTimeout(timer); log('OSM tile: FAILED'); resolve(); };
    img.src = 'https://tile.openstreetmap.org/12/3457/1931.png';
  });

  log('');
  log('DONE');
})();
</script>
</body>
</html>
